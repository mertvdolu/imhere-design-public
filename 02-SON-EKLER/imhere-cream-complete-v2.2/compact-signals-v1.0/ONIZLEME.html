<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IM HERE · Kompakt göstergeler</title><style>@font-face{font-family:Geist;src:url(../fonts/Geist-Regular.ttf)}*{box-sizing:border-box}body{background:#F4F1E9;color:#191A17;font-family:Geist,system-ui;margin:24px}header{max-width:760px}select{min-height:48px}main{width:390px;max-width:100%;border:1px solid #D9D5CB;padding:24px;font-size:calc(14px * var(--s,1));line-height:1.4}h2{font-size:calc(18px * var(--s,1));font-weight:500;margin:0 0 8px}article{padding:20px 0;border-bottom:1px solid #D9D5CB}.ratio{margin:8px 0;overflow-wrap:anywhere}.muted{color:#696A62}.slider{width:100%;height:48px;margin:0;appearance:none;background:transparent}.slider::-webkit-slider-runnable-track{height:2px;background:#7C7D73}.slider::-webkit-slider-thumb{appearance:none;width:16px;height:16px;margin-top:-7px;background:#191A17;border-radius:50%}.slider::-moz-range-track{height:2px;background:#7C7D73}.slider::-moz-range-thumb{width:16px;height:16px;background:#191A17;border:0;border-radius:50%}.ends{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;font:inherit;text-align:left;border:0;background:transparent;color:inherit}.name{flex:1}.dot{width:8px;height:8px;flex:none;border-radius:50%;background:#B63A32}.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;min-width:48px;background:#FCFAF5;border:0;color:inherit;font:inherit;padding:8px}.icon{width:24px;height:24px;position:relative}.icon .dot{position:absolute;right:-4px;top:-4px;outline:2px solid #FCFAF5}.nav{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.controls button{min-height:48px}label{display:block}small{font-size:12px}</style><header><h1>Kompakt göstergeler · v1.0</h1><p>Tasarım demosu. Örnek oranlar canlı veri değildir; genel düğme boyutları değiştirilmedi.</p><div class="controls"><select id="lang" aria-label="Dil"><option value="en">EN</option><option value="tr">TR</option></select><select onchange="document.documentElement.style.setProperty('--s',this.value)" aria-label="Metin ölçeği"><option value="1">%100</option><option value="2">%200</option></select><select onchange="document.querySelector('main').style.width=this.value+'px'" aria-label="Genişlik"><option>390</option><option>320</option><option>412</option></select><button onclick="setValue(null)">Unset</button><button onclick="setValue(0)">0</button><button onclick="setValue(50)">50</button><button onclick="setValue(100)">100</button></div></header><main><article><small>PROFILE · read-only</small><h2>Alex · Fictional profile</h2><div id="profileRatio" class="ratio"></div></article><article><h2 id="heading"></h2><div id="value" class="ratio"></div><input class="slider" id="slider" type="range" min="0" max="100" step="10" value="50"><div class="ends"><span id="friends"></span><span>Networking</span></div></article><article><small>CONNECTION ROW · unread</small><button class="row" id="unread"><span class="name">Maya · Fictional profile</span><i class="dot" aria-hidden="true"></i><span aria-hidden="true">›</span></button><small>CONNECTION ROW · read</small><button class="row"><span class="name">Alex · Fictional profile</span><span aria-hidden="true">›</span></button></article><article><small>MESSAGES TAB · unread / read</small><div class="nav"><button class="tab" id="unreadTab"><span class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H9l-5 4z"/></svg><i class="dot" aria-hidden="true"></i></span><span class="messages"></span></button><button class="tab"><span class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H9l-5 4z"/></svg></span><span class="messages"></span></button></div></article></main><script>let v=null;const $=x=>document.getElementById(x);function draw(){let tr=$('lang').value==='tr';let ratio=v===null?'':tr?`Networking %${v} · Arkadaşlık %${100-v}`:`Networking ${v}% · Friends ${100-v}%`;$('profileRatio').textContent=ratio;$('value').textContent=ratio||(tr?'Ayarlanmadı':'Not set');$('heading').textContent=tr?'Networking ve arkadaşlık':'Networking and friends';$('friends').textContent=tr?'Arkadaşlık':'Friends';$('slider').setAttribute('aria-label',tr?'Networking yüzdesi':'Networking percentage');$('slider').setAttribute('aria-valuetext',ratio||(tr?'Ayarlanmadı':'Not set'));let unread=tr?'Okunmamış mesaj':'Unread messages',msg=tr?'Mesajlar':'Messages';$('unread').setAttribute('aria-label','Maya, '+unread);$('unreadTab').setAttribute('aria-label',msg+', '+unread);document.querySelectorAll('.messages').forEach(x=>x.textContent=msg);document.documentElement.lang=tr?'tr':'en'}function setValue(n){v=n;$('slider').value=n??50;draw()}$('slider').oninput=e=>setValue(+e.target.value);$('slider').onpointerup=e=>setValue(+e.target.value);$('lang').onchange=draw;draw();</script></html>
