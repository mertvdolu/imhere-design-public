<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IM HERE · 1.5 mağaza görselleri</title>
<style>@font-face{font-family:Geist;src:url(assets/Geist-Regular.woff2)}@font-face{font-family:Geist;src:url(assets/Geist-Medium.woff2);font-weight:500}*{box-sizing:border-box}body{margin:0;background:#e8e4da;color:#191a17;font-family:Geist,system-ui}header,main{max-width:1440px;margin:auto;padding:28px}h1{font-weight:500;font-size:clamp(28px,4vw,44px);margin:0 0 12px}p{line-height:1.5}header{padding-bottom:8px}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center}select,label{font:inherit}select{margin:6px 0;min-height:48px;padding:8px 12px;max-width:100%;border:1px solid #777970;border-radius:12px;background:#f4f1e9;color:inherit}label{display:flex;align-items:center;gap:8px;min-height:48px}input{width:22px;height:22px}a{color:inherit;text-underline-offset:4px}a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #191a17;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}figure{margin:0}figure img{display:block;width:100%;height:auto;border:1px solid #b7b3a9}figcaption{font-size:14px;line-height:1.5;margin:10px 0 20px;overflow-wrap:anywhere}.feature{max-width:1024px;margin:40px auto 0}.feature img{width:100%;height:auto}.note{font-size:14px}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{padding:12px 0;min-height:48px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr}header,main{padding:18px}}
</style><header><h1>IM HERE · 1.5 mağaza kareleri</h1><p>1.4 görsel dili · 6 sahne · 3 boyut. Başlıklar ve alt satırlar gönderdiğin metinlerle aynı; uygulama ekranları değiştirilmedi.</p><div class="controls"><label for="size">Set <select id="size"><option value="ios-15-1206x2622">iPhone · 1206 × 2622</option><option value="ios-15-1320x2868">iPhone · 1320 × 2868</option><option value="play-15-phone">Android · 1080 × 1920</option></select></label><label><input type="checkbox" id="native">Ham ekranları göster</label></div><p id="status" role="status"></p><nav><a href="HANDOFF.md">Teslim notu</a><a href="VALIDATION.md">Kontroller</a><a href="MANIFEST.json">Dosya listesi</a></nav></header><main><div class="grid" id="grid"></div><section class="feature"><h2>Google Play öne çıkan görsel</h2><p>1.4 dosyası aynen korundu; “purpose” ifadesi içermiyor.</p><a href="play-feature/feature-graphic.png" target="_blank" rel="noopener"><img src="play-feature/feature-graphic.png" width="1024" height="500" alt="IM HERE — Start with a conversation; unchanged 1.4 feature graphic"></a></section></main>
<script>
const shots=[['01-community','KARE-1-topluluk-secimi.png','Choose your community.'],['02-nearby','KARE-2-yakindakiler.png','See who else is here.'],['03-filters','KARE-3b-filtre-paneli.png','Filter by job title.'],['04-request-profile','03-istek-profili.png',"See who's saying hello."],['05-chat','KARE-4-sohbet.png','Start with a conversation.'],['06-events','KARE-5-etkinlik.png','Events from our team.']];
const size=document.getElementById('size'),native=document.getElementById('native'),grid=document.getElementById('grid');
function draw(){const platform=size.value==='play-15-phone'?'android':'ios';grid.replaceChildren();for(const [id,file,title] of shots){const src=native.checked?`source/native/${platform}/${file}`:`${size.value}/${id}.png`;const fig=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');a.href=src;a.target='_blank';a.rel='noopener';img.src=src;img.alt=title+(native.checked?' — ham ekran':' — mağaza karesi');img.decoding='async';a.append(img);caption.textContent=id+'.png · '+title;fig.append(a,caption);grid.append(fig)}document.getElementById('status').textContent=native.checked?'Kaynak çekimler — kişi, metin, sayı, saat ve pil değiştirilmedi.':'Altı PNG — tam boyutta açmak için görsele tıkla.'}
size.addEventListener('change',draw);native.addEventListener('change',draw);draw();
</script></html>
